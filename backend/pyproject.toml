[project]
name = "split-genie-backend"
version = "0.1.0"
description = "Split Genie API: FastAPI + LangGraph"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-auth>=2.62.0",
    "itsdangerous>=2.2.0",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
