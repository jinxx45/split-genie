[project]
name = "split-genie-backend"
version = "0.1.0"
description = "Split Genie API: FastAPI + LangGraph"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "langgraph>=1.2.19",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
